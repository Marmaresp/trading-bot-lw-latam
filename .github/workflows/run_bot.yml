name: Run Trading Bot

on:
  schedule:
    - cron: '0 * * * *'   # Every hour at :00
  workflow_dispatch:       # Allows you to trigger it manually too

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (test branch)
        uses: actions/checkout@v5
        with:
          ref: test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install git+https://github.com/Marmaresp/trading-bot-lw-latam.git@test -q

      - name: Run bot
        run: python copia_de_exercise_bot.py

      - name: Commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add result_OHC.csv
          git diff --cached --quiet || git commit -m "Auto-update result_OHC.csv [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}